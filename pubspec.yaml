name: mystore
description: "خدمة سحابية للتسوق الآمن"

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.1
  hive: ^2.2.3
  audioplayers: ^6.0.0
  get: ^4.6.6
  cupertino_icons: "^1.0.6"
  hive_flutter: "^1.1.0"
  pdf: "^3.10.8"
  printing: "^5.12.0"
  path_provider: "^2.1.1"
  open_file: ^4.0.0
  easy_localization: "^3.0.7"
  flutter_svg: "^2.0.9"
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.3
  image_picker: "^1.0.7"
  share_plus: ^13.1.0
  flutter_archive: ^6.0.0
  lottie: ^3.3.3
  restart_app: ^1.2.1
  file_picker: ^12.0.0-beta.5
  vibration: ^3.1.8
  google_mlkit_text_recognition: ^0.15.1
  flutter_stripe: ^13.0.0
  url_launcher: "^6.3.2"
  provider: "^6.1.1"
  inno_build: "^0.4.0"
  intl: any
  flutter_native_splash: ^2.4.1
  font_awesome_flutter: ^10.6.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.4
  connectivity_plus: ^6.0.3
  firebase_storage: ^12.4.4
  seo_renderer: ^0.6.0
  flutter_seo: ^1.0.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  url_strategy: ^0.2.0
  supabase_flutter: ^2.0.0
  firebase_messaging: ^15.2.10
  flutter_app_badge_control: ^0.0.2
  flutter_app_badge: ^2.0.0
  cloud_functions: ^5.6.2
  universal_html: ^2.2.4
  flutter_secure_storage: ^11.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/images/Ryaal.png
    - "assets/translations/ar.json"


  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700