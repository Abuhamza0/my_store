name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install iOS Platform
        run: |
          echo "Installing iOS platform..."
          xcodebuild -downloadPlatform iOS || true
          xcrun simctl list runtimes || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager
          echo "✅ SPM disabled"

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Regenerate iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios .
          echo "✅ iOS project regenerated"

      - name: Set iOS Deployment Target to 15.5
        run: |
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.5" ios/Flutter/AppFrameworkInfo.plist || true
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.5'/g" ios/Podfile
            grep -q "platform :ios" ios/Podfile || sed -i '' "2i\\
          platform :ios, '15.5'
          " ios/Podfile
          fi
          find ios -name "project.pbxproj" -exec sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" {} +
          echo "✅ Done!"

      - name: Build Flutter framework (no codesign)
        run: |
          flutter build ios --release --no-codesign --config-only
          echo "✅ Flutter framework built"

      - name: Install Pods
        run: |
          cd ios && pod install --repo-update
          cd ..

      - name: Build iOS with xcodebuild (no codesign)
        run: |
          cd ios
          
          # بناء باستخدام xcodebuild مباشرة - بدون توقيع
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            BUILD_DIR="$(pwd)/build" \
            clean build
          
          cd ..
          echo "✅ xcodebuild completed"

      - name: Find and verify .app
        run: |
          echo "Searching for Runner.app..."
          find . -name "Runner.app" -type d 2>/dev/null || true
          find . -name "*.app" -type d 2>/dev/null || true

      - name: Create Payload directory
        run: |
          mkdir -p Payload
          
          # البحث عن Runner.app
          APP_PATH=$(find ios/build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Runner.app" -type d | head -n 1)
          fi
          
          echo "Found app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Runner.app not found!"
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          echo "✅ Copied Runner.app to Payload"

      - name: Create IPA
        run: |
          zip -r -9 Runner.ipa Payload/
          ls -lh Runner.ipa
          echo "✅ IPA created"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: Runner.ipa
          retention-days: 30
