name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Generate Podfile
        run: |
          echo "🔧 Running flutter build to generate Podfile..."
          flutter build ios --config-only --no-codesign || true
          
          echo "📄 Checking Podfile..."
          if [ -f ios/Podfile ]; then
            echo "✅ Podfile created"
            cat ios/Podfile
          else
            echo "❌ Podfile not created - creating manually"
            flutter create --platforms=ios .
          fi

      - name: Set iOS Deployment Target to 15.5
        run: |
          echo "🔧 Setting iOS deployment target to 15.5..."
          
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.5" ios/Flutter/AppFrameworkInfo.plist || true
          
          if [ -f ios/Podfile ]; then
            if ! grep -q "platform :ios" ios/Podfile; then
              sed -i '' "1i\\
platform :ios, '15.5'
" ios/Podfile
            else
              sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.5'/g" ios/Podfile
            fi
            echo "✅ Podfile modified:"
            cat ios/Podfile
          fi
          
          find ios -name "project.pbxproj" -exec sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" {} +
          
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.5" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.5" ios/Runner/Info.plist 2>/dev/null || true
          
          echo "✅ iOS deployment target set to 15.5"

      - name: Clean Pods and reinstall
        run: |
          echo "🧹 Cleaning Pods..."
          rm -rf ios/Pods ios/Podfile.lock
          
          echo "📦 Running pod install..."
          cd ios && pod install --repo-update
          cd ..

      - name: Precache iOS
        run: flutter precache --ios

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Create Payload directory
        run: mkdir -p Payload

      - name: Copy Runner.app to Payload
        run: cp -R build/ios/iphoneos/Runner.app Payload/

      - name: Create IPA
        run: zip -r -9 Runner.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: Runner.ipa
          retention-days: 30
