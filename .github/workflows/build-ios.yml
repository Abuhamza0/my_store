name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Show available platforms
        run: |
          echo "Available SDKs:"
          xcodebuild -showsdks
          echo ""
          echo "Installed Platforms:"
          xcrun simctl list runtimes || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager
          echo "✅ SPM disabled"

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Regenerate iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios .
          echo "✅ iOS project regenerated"

      - name: Set iOS Deployment Target to 15.5
        run: |
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.5" ios/Flutter/AppFrameworkInfo.plist || true
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.5'/g" ios/Podfile
            grep -q "platform :ios" ios/Podfile || sed -i '' "2i\\
          platform :ios, '15.5'
          " ios/Podfile
          fi
          find ios -name "project.pbxproj" -exec sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" {} +
          echo "✅ Done!"

      - name: Install Pods
        run: |
          cd ios && pod install --repo-update
          cd ..

      - name: Disable Code Signing
        run: |
          echo "Disabling code signing..."
          cd ios
          
          find . -name "project.pbxproj" -exec sed -i '' \
            's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' {} +
          
          find . -name "project.pbxproj" -exec sed -i '' \
            's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
          
          find . -name "project.pbxproj" -exec sed -i '' \
            's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' {} +
          
          find . -name "project.pbxproj" -exec sed -i '' \
            's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' {} +
          
          find . -name "project.pbxproj" -exec sed -i '' \
            's/DEVELOPMENT_TEAM = "[^"]*";/DEVELOPMENT_TEAM = "";/g' {} +
          
          cd ..
          echo "✅ Code signing disabled"

      - name: Precache iOS
        run: flutter precache --ios

      - name: Build iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=1

      - name: Create Payload directory
        run: mkdir -p Payload

      - name: Copy Runner.app to Payload
        run: cp -R build/ios/iphoneos/Runner.app Payload/

      - name: Create IPA
        run: zip -r -9 Runner.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: Runner.ipa
          retention-days: 30
