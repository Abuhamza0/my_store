workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
          echo "✅ SPM disabled"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set iOS Deployment Target
        script: |
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.5" ios/Flutter/AppFrameworkInfo.plist || true
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.5'/g" ios/Podfile
            grep -q "platform :ios" ios/Podfile || sed -i '' "2i\\
          platform :ios, '15.5'
          " ios/Podfile
          fi
          find ios -name "project.pbxproj" -exec sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" {} +
          echo "✅ Deployment target set to 15.5"
      - name: Install Pods
        script: |
          cd ios && pod install --repo-update && cd ..
          echo "✅ Pods installed"
      - name: Build iOS (No Codesign)
        script: |
          flutter build ios --release --no-codesign
          echo "✅ iOS build completed"
      - name: Create IPA
        script: |
          echo "Creating IPA..."
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Runner.ipa Payload/
          echo "✅ IPA created"
          ls -lh Runner.ipa
    artifacts:
      - Runner.ipa
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - alarhby0190@gmail.com
        notify:
          success: true
          failure: true
